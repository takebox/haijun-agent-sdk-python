name: Set up Haijun API auth
description: >-
  Mints a GitHub OIDC token, exchanges it with platform.juglow.my.id for a
  scoped Haijun API key, and exports HAIJUN_AUTH_TOKEN so the SDK / CLI can
  authenticate without storing long-lived secrets. The 3 workload-identity
  federation variables are still exported for downstream tooling.

runs:
  using: composite
  steps:
    - name: Exchange OIDC token for Haijun API key
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      with:
        script: |
          const fs = require("fs");
          const path = require("path");

          const AUDIENCE = "https://platform.juglow.my.id";
          const EXCHANGE_URL = `${AUDIENCE}/api/v1/identity/exchange`;

          // 1. Mint GitHub OIDC identity token
          const idToken = await core.getIDToken(AUDIENCE);
          core.setSecret(idToken);

          // 2. Exchange with Haijun platform
          const res = await fetch(EXCHANGE_URL, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ id_token: idToken }),
          });

          const body = await res.json().catch(() => ({}));

          if (!res.ok || !body.api_key) {
            core.setFailed(
              `Platform token exchange failed (${res.status}): ${body.error || res.statusText}${body.detail ? " — " + body.detail : ""}`
            );
            return;
          }

          core.exportVariable("HAIJUN_AUTH_TOKEN", body.api_key);
          core.exportVariable("HAIJUN_API_KEY", body.api_key);
          core.setSecret(body.api_key);

          // Persist raw key in case a subprocess needs it on disk (Docker bind-mount etc.)
          const tokenFile = path.join(process.env.RUNNER_TEMP, "haijun-api-key");
          fs.writeFileSync(tokenFile, body.api_key, { mode: 0o600 });
          core.exportVariable("HAIJUN_IDENTITY_TOKEN_FILE", tokenFile);

          core.info(`HAIJUN_AUTH_TOKEN issued for user ${body.user_id} via rule ${body.rule_id}`);
