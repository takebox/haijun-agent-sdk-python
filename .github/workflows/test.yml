name: Test

on:
  pull_request:
  push:
    branches:
      - "main"

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Confirm the newest mcp major is under test
        # test-mcp-v1-floor covers mcp 1.x; this job must exercise 2.x or newer.
        run: |
          python -c "import importlib.metadata as m; v = m.version('mcp'); print('mcp', v); assert int(v.split('.')[0]) >= 2, v"

      - name: Run tests
        run: |
          python -m pytest tests/ -v --cov=haijun_agent_sdk --cov-report=xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4.6.0 (sha-pinned)
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  test-mcp-v1-floor:
    # The main test job resolves the newest mcp the SDK allows (2.x). This one
    # pins the oldest supported release so mcp 1.x support stays tested.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies with the mcp floor
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install "mcp==1.23.0"
          python -c "import importlib.metadata as m; v = m.version('mcp'); print('mcp', v); assert v == '1.23.0', v"

      - name: Run mypy against mcp 1.x
        run: |
          mypy src/ scripts/

      - name: Run tests
        run: |
          python -m pytest tests/ -v --cov=haijun_agent_sdk --cov-report=xml

      - name: Upload coverage to Codecov
        # Merged with the main job's report, so code that only runs on one
        # mcp major is counted from whichever job exercises it.
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4.6.0 (sha-pinned)
        with:
          file: ./coverage.xml
          flags: mcp-v1-floor
          fail_ci_if_error: false

  test-e2e:
    # Skip on forks since they can't mint the OIDC token used for Haijun API auth
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ matrix.os }}
    needs: test # Run after unit tests pass
    permissions:
      contents: read
      # Required to mint the OIDC token exchanged for a Haijun API access
      # token (workload identity federation)
      id-token: write
    strategy:
      # Default fail-fast cancels the other OS legs as soon as one fails, which
      # hides a failing OS behind the first runner to break. Keep every leg so
      # each platform's install path gets exercised and reported.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Haijun Code (Linux/macOS)
        if: runner.os == 'Linux' || runner.os == 'macOS'
        # `shell: bash` runs with -eo pipefail. Without pipefail the pipeline
        # takes its status from `bash`, which exits 0 on an empty script, so a
        # failed `curl` shows up later as a confusing "haijun: not found" in a
        # different step. With it, the step that actually broke is the one that
        # fails.
        shell: bash
        run: |
          # The downloads.haijun.my.id hostname can serve stale 404 results at
          # some Cloudflare edges, so CI fetches from the worker's own
          # *.workers.dev host (separate cache namespace) instead.
          export HAIJUN_DOWNLOAD_BASE_URL=https://cli.rompahjunaidi.workers.dev/cli
          curl -fsSL 'https://cli.rompahjunaidi.workers.dev/cli/install-v2.sh' | bash
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Probe CLI binary on macOS (diagnostic)
        # The macOS installer is a compiled native binary; on a too-new OS
        # (macos-latest arm64) it segfaults during `install`. This probe
        # distinguishes a broken platform binary from a broken install step.
        if: ${{ always() && runner.os == 'macOS' }}
        continue-on-error: true
        run: |
          # Download the darwin-arm64 binary directly and try to run it, to
          # isolate a platform-binary problem from an install-step problem.
          mkdir -p /tmp/hjdiag
          for i in $(seq 0 6); do
            curl -fsSL "https://cli.rompahjunaidi.workers.dev/cli/0.1.0/darwin-arm64/haijun.part${i}?v=20260912p1" -o "/tmp/hjdiag/p.$i" || { echo "DIAG part $i download failed"; break; }
          done
          cat /tmp/hjdiag/p.* > /tmp/hjdiag/haijun
          chmod +x /tmp/hjdiag/haijun
          ls -la /tmp/hjdiag/
          /tmp/hjdiag/haijun -v; echo "DIAG direct -v exit=$?"
          '$HOME/.local/bin/claude' -v; echo "DIAG launcher -v exit=$?"

      - name: Diagnose manifest fetch (Windows)
        # The Windows runner's Cloudflare edge returns 404 for the manifest even
        # on a freshly-deployed workers.dev path that answers 200 elsewhere.
        # Dump the raw response (status/body/remote IP) from this exact region
        # using curl.exe to see whether the 404 is network-level or specific to
        # PowerShell's irm.
        if: runner.os == 'Windows'
        continue-on-error: true
        run: |
          $u = 'https://cli.rompahjunaidi.workers.dev/cli/0.1.0/manifest.v2.json?v=20260912p1'
          curl.exe -sS -o NUL -w "curl status=%{http_code} remote_ip=%{remote_ip} time=%{time_total} redirect=%{redirect_url}`n" $u
          curl.exe -sS $u; Write-Output "`n--curl body end--"
          try {
            $r = Invoke-WebRequest -Uri $u -UseBasicParsing -SkipHttpErrorCheck -ErrorAction Stop
            Write-Output "irm status=$($r.StatusCode) length=$($r.RawContentLength) respUri=$($r.BaseResponse.ResponseUri)"
          } catch { Write-Output "irm ERR: $($_.Exception.Message)" }
        shell: pwsh

      - name: Install Haijun Code (Windows)
        if: runner.os == 'Windows'
        run: |
          # The downloads.haijun.my.id hostname can serve stale 404 results at
          # some Cloudflare edges, so CI fetches from the worker's own
          # *.workers.dev host (separate cache namespace) instead.
          $env:HAIJUN_DOWNLOAD_BASE_URL = 'https://cli.rompahjunaidi.workers.dev/cli'
          irm 'https://cli.rompahjunaidi.workers.dev/cli/install-v2.ps1' | iex
          $haijunPath = "$env:USERPROFILE\.local\bin"
          echo "$haijunPath" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        shell: pwsh

      - name: Verify Haijun Code installation
        run: haijun -v

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Set up Haijun API auth (workload identity federation)
        uses: ./.github/actions/setup-haijun-auth

      # CI's fresh checkout is an untrusted workspace, so Haijun Code drops
      # the project-scoped permissions.allow grants in this repo's committed
      # .haijun/settings.json and warns on stderr about it. Record the trust a
      # developer grants via the trust dialog once, so runs launched from the
      # checkout exercise the real trusted-workspace settings path. Only
      # affects CLI runs whose cwd is inside the checkout (some e2e tests
      # deliberately use a temp cwd). See scripts/trust_workspace.py.
      - name: Trust the workspace for Haijun Code
        run: python scripts/trust_workspace.py

      - name: Run end-to-end tests with real API
        env:
          HAIJUN_FEDERATION_RULE_ID: ${{ vars.HAIJUN_FEDERATION_RULE_ID }}
          HAIJUN_ORGANIZATION_ID: ${{ vars.HAIJUN_ORGANIZATION_ID }}
          HAIJUN_SERVICE_ACCOUNT_ID: ${{ vars.HAIJUN_SERVICE_ACCOUNT_ID }}
        run: |
          python -m pytest e2e-tests/ -v -m e2e

  test-e2e-docker:
    # Skip on forks since they can't mint the OIDC token used for Haijun API auth
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    needs: test # Run after unit tests pass
    permissions:
      contents: read
      # Required to mint the OIDC token exchanged for a Haijun API access
      # token (workload identity federation)
      id-token: write
    # Run e2e tests in Docker to catch container-specific issues like #406

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker test image
        run: docker build -f Dockerfile.test -t haijun-sdk-test .

      - name: Set up Haijun API auth (workload identity federation)
        uses: ./.github/actions/setup-haijun-auth

      - name: Run e2e tests in Docker
        env:
          HAIJUN_FEDERATION_RULE_ID: ${{ vars.HAIJUN_FEDERATION_RULE_ID }}
          HAIJUN_ORGANIZATION_ID: ${{ vars.HAIJUN_ORGANIZATION_ID }}
          HAIJUN_SERVICE_ACCOUNT_ID: ${{ vars.HAIJUN_SERVICE_ACCOUNT_ID }}
        # Bind-mount the identity token file so the background refresher on
        # the host keeps the in-container copy fresh too
        run: |
          docker run --rm \
            -e HAIJUN_FEDERATION_RULE_ID \
            -e HAIJUN_ORGANIZATION_ID \
            -e HAIJUN_SERVICE_ACCOUNT_ID \
            -e HAIJUN_IDENTITY_TOKEN_FILE=/run/haijun-identity-token \
            -v "$HAIJUN_IDENTITY_TOKEN_FILE:/run/haijun-identity-token:ro" \
            haijun-sdk-test python -m pytest e2e-tests/ -v -m e2e

  test-examples:
    # Skip on forks since they can't mint the OIDC token used for Haijun API auth
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    needs: test-e2e # Run after e2e tests
    permissions:
      contents: read
      # Required to mint the OIDC token exchanged for a Haijun API access
      # token (workload identity federation)
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Haijun Code (Linux)
        if: runner.os == 'Linux'
        # `shell: bash` runs with -eo pipefail; see the note in the test job.
        shell: bash
        run: |
          export HAIJUN_DOWNLOAD_BASE_URL=https://cli.rompahjunaidi.workers.dev/cli
          curl -fsSL 'https://cli.rompahjunaidi.workers.dev/cli/install-v2.sh' | bash
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install Haijun Code (Windows)
        if: runner.os == 'Windows'
        run: |
          $env:HAIJUN_DOWNLOAD_BASE_URL = 'https://cli.rompahjunaidi.workers.dev/cli'
          irm 'https://cli.rompahjunaidi.workers.dev/cli/install-v2.ps1' | iex
          $haijunPath = "$env:USERPROFILE\.local\bin"
          echo "$haijunPath" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        shell: pwsh

      - name: Verify Haijun Code installation
        run: haijun -v

      - name: Install dependencies
        run: |
          pip install -e .

      - name: Set up Haijun API auth (workload identity federation)
        uses: ./.github/actions/setup-haijun-auth

      # Same as in test-e2e: trust the fresh checkout so Haijun Code honors the
      # project-scoped grants in this repo's committed .haijun/settings.json.
      - name: Trust the workspace for Haijun Code
        run: python scripts/trust_workspace.py

      - name: Run example scripts (Linux)
        if: runner.os == 'Linux'
        env:
          HAIJUN_FEDERATION_RULE_ID: ${{ vars.HAIJUN_FEDERATION_RULE_ID }}
          HAIJUN_ORGANIZATION_ID: ${{ vars.HAIJUN_ORGANIZATION_ID }}
          HAIJUN_SERVICE_ACCOUNT_ID: ${{ vars.HAIJUN_SERVICE_ACCOUNT_ID }}
          PYTHONUNBUFFERED: "1"
        run: |
          python examples/quick_start.py
          timeout 300 python examples/streaming_mode.py all
          timeout 120 python examples/hooks.py PreToolUse
          timeout 120 python examples/hooks.py DecisionFields

      - name: Run example scripts (Windows)
        if: runner.os == 'Windows'
        env:
          HAIJUN_FEDERATION_RULE_ID: ${{ vars.HAIJUN_FEDERATION_RULE_ID }}
          HAIJUN_ORGANIZATION_ID: ${{ vars.HAIJUN_ORGANIZATION_ID }}
          HAIJUN_SERVICE_ACCOUNT_ID: ${{ vars.HAIJUN_SERVICE_ACCOUNT_ID }}
          PYTHONUNBUFFERED: "1"
        run: |
          python examples/quick_start.py
          $job = Start-Job { python examples/streaming_mode.py all }
          Wait-Job $job -Timeout 300 | Out-Null
          Stop-Job $job
          Receive-Job $job

          $job = Start-Job { python examples/hooks.py PreToolUse }
          Wait-Job $job -Timeout 120 | Out-Null
          Stop-Job $job
          Receive-Job $job

          $job = Start-Job { python examples/hooks.py DecisionFields }
          Wait-Job $job -Timeout 120 | Out-Null
          Stop-Job $job
          Receive-Job $job
        shell: pwsh
